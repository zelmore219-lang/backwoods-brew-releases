name: Verify and publish compatible Employee Android update
on:
  push:
    branches: [main, 'codex/employee-updater-*']
    paths:
      - android-platform-updates/**
      - scripts/publish_android_platform.py
      - tests/test_android_platform_release.py
      - .github/workflows/android-platform.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: employee-app-updates
  cancel-in-progress: false
jobs:
  verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;35.0.0'
      - name: Check platform preservation, identity and accepted source guards
        run: python -m unittest discover -s tests -p test_android_platform_release.py -v
      - name: Verify accepted APK, publish it, then update Android only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_android_platform.py --publish
